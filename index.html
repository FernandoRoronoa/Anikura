<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AniKura — anime y estrenos</title>
<meta name="description" content="Anime en español: catálogo, estrenos de la semana, calendario, biblioteca y comunidad.">
<meta name="theme-color" content="#0b0516">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Unbounded:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0516;--s1:#140a26;--s2:#1d1036;--s3:#2a1a4a;--line:rgba(167,139,250,.16);
  --violet:#7c4dff;--volt:#37ff8b;--volt-ink:#04210f;
  --tx:#f4efff;--mut:#ab9dcc;--faint:#7a6b9f;
  --r-card:10px;--r-panel:20px;
  --f-d:'Unbounded',system-ui,sans-serif;--f-b:'Hanken Grotesk',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{color-scheme:dark;-webkit-text-size-adjust:100%}
body{background:radial-gradient(1100px 620px at 88% -8%,rgba(124,77,255,.30),transparent 62%),radial-gradient(900px 520px at -8% 34%,rgba(55,255,139,.055),transparent 60%),var(--bg);background-attachment:fixed;color:var(--tx);font:15px/1.5 var(--f-b);min-height:100vh;padding-bottom:96px}
a{color:inherit}
button{font-family:inherit}
img{max-width:100%}
:focus-visible{outline:2px solid var(--volt);outline-offset:2px;border-radius:6px}
.skip{position:fixed;left:12px;top:-60px;z-index:200;background:var(--volt);color:var(--volt-ink);padding:10px 16px;border-radius:999px;font-weight:700;border:0;cursor:pointer}
.skip:focus{top:12px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
#top{position:fixed;inset:0 0 auto 0;z-index:60;height:64px;display:flex;align-items:center;gap:26px;padding:0 clamp(16px,4vw,48px);background:linear-gradient(180deg,rgba(11,5,22,.9),rgba(11,5,22,0));transition:background .25s}
#top.solid{background:rgba(11,5,22,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-d);font-weight:800;font-size:18px;letter-spacing:-.03em;text-decoration:none;white-space:nowrap}
.logo b{color:var(--volt);font-weight:800}
.logo svg{width:28px;height:28px;flex:none}
.nav{display:flex;gap:2px}
.nav a{padding:8px 13px;border-radius:999px;color:var(--mut);text-decoration:none;font-weight:600;font-size:14px;white-space:nowrap}
.nav a:hover{color:var(--tx);background:rgba(255,255,255,.07)}
.nav a.on{color:var(--volt)}
.spacer{flex:1}
.ibtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);border:0;color:var(--tx);cursor:pointer;position:relative;text-decoration:none;flex:none}
.ibtn:hover{background:rgba(255,255,255,.16)}
.ibtn svg{width:20px;height:20px}
.ibtn.avatar{background:var(--volt);color:var(--volt-ink);font-weight:800;font-size:15px}
.badge{position:absolute;top:-3px;right:-3px;background:var(--volt);color:var(--volt-ink);font-size:10px;font-weight:800;border-radius:999px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}
.notice{position:relative;z-index:55;margin-top:64px;background:linear-gradient(90deg,rgba(124,77,255,.35),rgba(55,255,139,.14));border-bottom:1px solid var(--line);padding:10px clamp(16px,4vw,48px);display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13.5px;color:#e5dbff}

.notice button{margin-left:auto}
.notice[hidden]{display:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 22px;border-radius:999px;border:0;font:700 15px var(--f-b);cursor:pointer;text-decoration:none;color:var(--tx);background:rgba(255,255,255,.11);transition:transform .15s,background .15s,box-shadow .2s;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.2)}
.btn.volt{background:var(--volt);color:var(--volt-ink);box-shadow:0 12px 32px -10px rgba(55,255,139,.65)}
.btn.volt:hover{background:#74ffae;transform:translateY(-1px)}
.btn.sm{height:36px;padding:0 15px;font-size:13px}
.btn.round{width:46px;padding:0}
.btn.on{background:rgba(55,255,139,.18);color:var(--volt)}
.btn svg{width:18px;height:18px;flex:none}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* hero */
.hero{position:relative;min-height:min(82vh,760px);display:flex;align-items:flex-end;padding:130px clamp(16px,4vw,48px) 70px;overflow:hidden;isolation:isolate}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center 22%;z-index:-2;animation:hbg .9s ease both}
@keyframes hbg{from{opacity:0;transform:scale(1.05)}to{opacity:1;transform:scale(1)}}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,var(--bg) 4%,rgba(11,5,22,.78) 38%,rgba(11,5,22,.04) 78%),linear-gradient(0deg,var(--bg) 2%,rgba(11,5,22,0) 46%)}
.hero-body{max-width:640px;animation:rise .7s .1s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.hero h1{font-family:var(--f-d);font-weight:800;font-size:clamp(26px,3.8vw,48px);line-height:1.08;letter-spacing:-.04em;margin:16px 0 14px;text-wrap:balance;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hero p.syn{color:#ddd3f5;max-width:54ch;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hero-actions{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap}
.hero-art{position:absolute;right:clamp(70px,10vw,170px);bottom:64px;width:clamp(200px,22vw,320px);aspect-ratio:2/3;border-radius:20px;overflow:hidden;transform:rotate(3deg);box-shadow:0 40px 80px -20px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.12);animation:rise .8s .2s cubic-bezier(.2,.8,.2,1) both}
.hero-dots{position:absolute;right:clamp(16px,4vw,48px);bottom:70px;display:flex;flex-direction:column;gap:8px}
.hero-dots button{width:5px;height:30px;border-radius:5px;border:0;background:rgba(255,255,255,.25);cursor:pointer;position:relative;overflow:hidden;padding:0}
.hero-dots button.on::after{content:"";position:absolute;inset:0;background:var(--volt);transform-origin:top;animation:fill 8s linear forwards}
@keyframes fill{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:999px;background:rgba(255,255,255,.11);font-size:13px;font-weight:600;color:#e6dcfb}
.chip.score{background:rgba(55,255,139,.15);color:var(--volt)}
.chip svg{width:14px;height:14px}

/* sections and rows */
.sec{padding:0 clamp(16px,4vw,48px);margin-top:38px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:12px}
.sec-h h2{font-family:var(--f-d);font-weight:700;font-size:clamp(16px,1.9vw,21px);letter-spacing:-.025em}
.sec-h a{color:var(--mut);font-size:14px;font-weight:600;text-decoration:none;white-space:nowrap}
.sec-h a:hover{color:var(--volt)}
.rowwrap{position:relative}
.scroller{scroll-padding-left:4px;display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;padding:8px 4px 20px;margin:0 -4px}
.scroller::-webkit-scrollbar{display:none}
.arrow{position:absolute;top:calc(50% - 44px);width:44px;height:44px;border-radius:50%;border:0;background:rgba(11,5,22,.88);color:var(--tx);display:none;place-items:center;cursor:pointer;z-index:4;box-shadow:0 8px 24px rgba(0,0,0,.55)}
.arrow svg{width:22px;height:22px}
.rowwrap:hover .arrow{display:grid}
.arrow.l{left:-16px}.arrow.r{right:-16px}
.arrow:hover{background:var(--volt);color:var(--volt-ink)}
@media(hover:none){.arrow{display:none!important}}

/* cards */
.card{flex:0 0 auto;width:clamp(128px,14.5vw,190px);scroll-snap-align:start;position:relative}
.card .poster{display:block;position:relative;aspect-ratio:2/3;border-radius:var(--r-card);overflow:hidden;background:var(--s2);transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s}
.art{position:absolute;inset:0;display:grid;place-items:center}
.art span{font-family:var(--f-d);font-weight:800;font-size:clamp(26px,4vw,44px);letter-spacing:-.05em;color:rgba(255,255,255,.34)}
.card .poster img,.thumb img,.tposter img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.card:hover .poster,.card:focus-within .poster{transform:translateY(-4px) scale(1.035);box-shadow:0 18px 40px -12px rgba(0,0,0,.75),0 0 0 2px var(--volt)}
.add{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(11,5,22,.8);color:var(--tx);display:grid;place-items:center;cursor:pointer;opacity:0;transition:opacity .15s;z-index:2}
.add svg{width:17px;height:17px}
.card:hover .add,.add:focus-visible,.add.on{opacity:1}
.add.on{background:var(--volt);color:var(--volt-ink)}
@media(hover:none){.add{opacity:1}}
.poster .eps{position:absolute;left:8px;bottom:8px;background:rgba(11,5,22,.82);padding:2px 8px;border-radius:6px;font-size:12px;font-weight:700}
.card .meta{display:block;text-decoration:none}
.card h3{font-size:14px;font-weight:700;margin-top:10px;line-height:1.28;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .sub{display:flex;justify-content:space-between;gap:8px;color:var(--mut);font-size:12.5px;margin-top:3px}
.star{color:var(--volt);font-weight:700}
.rank{flex:0 0 auto;display:flex;align-items:flex-end;scroll-snap-align:start}
.rank .num{font-family:var(--f-d);font-weight:900;font-size:clamp(84px,9vw,128px);line-height:.78;color:transparent;-webkit-text-stroke:2px var(--volt);margin-right:-12px;z-index:0;letter-spacing:0;flex:none;pointer-events:none;padding-bottom:62px}
.rank .card{width:clamp(112px,12vw,160px);z-index:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 16px}
.grid .card{width:auto}

/* episode cards */
.ep{flex:0 0 auto;width:clamp(232px,24vw,300px);scroll-snap-align:start;text-decoration:none;display:block}
.thumb{position:relative;aspect-ratio:16/9;border-radius:var(--r-card);overflow:hidden;background:var(--s2)}
.ep .tag{position:absolute;left:8px;bottom:8px;background:rgba(11,5,22,.84);padding:3px 9px;border-radius:6px;font-size:12px;font-weight:800;z-index:1}
.ep .tag.new{background:var(--volt);color:var(--volt-ink)}
.ep .play{position:absolute;inset:0;display:grid;place-items:center;background:rgba(11,5,22,.45);opacity:0;transition:.2s;z-index:1}
.ep .play svg{width:38px;height:38px;color:var(--volt)}
.ep:hover .play,.ep:focus-visible .play{opacity:1}
.ep:hover .thumb{box-shadow:0 0 0 2px var(--volt)}
.ep h3{font-size:14px;font-weight:700;margin-top:9px;line-height:1.28;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ep .when{color:var(--mut);font-size:12.5px;margin-top:2px}
.eps-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px 16px}
.eps-grid .ep{width:auto}

/* page chrome */
.page{padding:96px clamp(16px,4vw,48px) 12px}
body.hn .page{padding-top:40px}
.page h1{font-family:var(--f-d);font-weight:800;font-size:clamp(24px,3.4vw,38px);letter-spacing:-.04em;line-height:1.1}
.page .lead{color:var(--mut);margin-top:8px;max-width:60ch}
.live{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:13px;color:var(--volt);margin-bottom:10px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--volt);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(55,255,139,.6)}100%{box-shadow:0 0 0 10px rgba(55,255,139,0)}}
.filters{display:flex;flex-wrap:wrap;gap:14px;margin:24px 0 8px}
.sel{display:flex;flex-direction:column;gap:5px}
.sel label{font-size:12.5px;color:var(--mut);font-weight:700}
select,.field{height:44px;border-radius:12px;background:var(--s2);border:1px solid var(--line);color:var(--tx);padding:0 14px;font:600 14px var(--f-b);min-width:176px}
textarea.field{height:auto;padding:12px 14px;line-height:1.5;resize:vertical;width:100%}
input.field{width:100%}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{height:36px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--mut);font:600 13.5px var(--f-b);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pill:hover{color:var(--tx);border-color:rgba(167,139,250,.45)}
.pill.on{background:var(--volt);color:var(--volt-ink);border-color:var(--volt)}
.more{display:flex;justify-content:center;margin:28px 0}
.empty{border:1px dashed rgba(167,139,250,.3);border-radius:var(--r-panel);padding:34px 24px;text-align:center;color:var(--mut);max-width:560px;margin:18px auto}
.empty h3{color:var(--tx);font-size:17px;margin-bottom:6px}
.empty .btn{margin-top:16px}
.sk{border-radius:var(--r-card);background:linear-gradient(100deg,var(--s2) 30%,var(--s3) 50%,var(--s2) 70%);background-size:300% 100%;animation:sh 1.4s infinite linear}
@keyframes sh{from{background-position:100% 0}to{background-position:-100% 0}}
.skrow{display:flex;gap:14px;overflow:hidden}
.skrow .sk{flex:0 0 clamp(128px,14.5vw,190px);aspect-ratio:2/3}
.skrow.wide .sk{flex-basis:clamp(232px,24vw,300px);aspect-ratio:16/9}

/* genres */
.genres{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:26px}
.gtile{position:relative;height:110px;border-radius:16px;overflow:hidden;padding:16px 18px;text-decoration:none;display:flex;flex-direction:column;justify-content:flex-end;transition:transform .2s,box-shadow .2s}
.gtile:hover{transform:translateY(-3px);box-shadow:0 0 0 2px var(--volt)}
.gtile b{font-family:var(--f-d);font-size:17px;letter-spacing:-.03em;position:relative}
.gtile small{color:rgba(255,255,255,.7);font-size:12.5px;position:relative}
.gtile::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.1)}

/* title page */
.tbanner{position:relative;padding:120px clamp(16px,4vw,48px) 34px;overflow:hidden;isolation:isolate}
body.hn .tbanner{padding-top:64px}
.tbanner .bg{position:absolute;inset:0;background-size:cover;background-position:center 20%;z-index:-2}
.tbanner::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,var(--bg) 4%,rgba(11,5,22,.62) 60%,rgba(11,5,22,.35)),linear-gradient(90deg,rgba(11,5,22,.85),rgba(11,5,22,.2))}
.tb-in{display:grid;grid-template-columns:230px 1fr;gap:34px;align-items:end;max-width:1200px}
.tposter{position:relative;aspect-ratio:2/3;border-radius:14px;overflow:hidden;box-shadow:0 24px 60px -16px rgba(0,0,0,.8);background:var(--s2)}
.tinfo h1{font-family:var(--f-d);font-weight:800;font-size:clamp(22px,3vw,38px);line-height:1.06;letter-spacing:-.04em;margin:14px 0;text-wrap:balance}
.tinfo .syn{color:#ddd3f5;max-width:70ch}
.tinfo .syn.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.linkbtn{background:none;border:0;color:var(--volt);font-weight:700;cursor:pointer;padding:6px 0;font-size:14px}
.tact{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;position:relative}
.menu{position:absolute;top:52px;left:0;z-index:20;min-width:210px;background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:var(--tx);padding:10px 12px;border-radius:9px;cursor:pointer;font:600 14px var(--f-b)}
.menu button:hover{background:rgba(255,255,255,.08)}
.menu button.on{color:var(--volt)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:22px;max-width:900px}
.stat{background:rgba(29,16,54,.72);border:1px solid var(--line);border-radius:14px;padding:11px 14px}
.stat small{display:block;color:var(--mut);font-size:12px;font-weight:600}
.stat b{font-size:15px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{padding:13px 16px;color:var(--mut);font:700 14.5px var(--f-b);background:none;border:0;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--tx)}
.tab.on{color:var(--tx);border-color:var(--volt)}
.tabpanel{padding-top:18px}
.eptools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.eptools .field{flex:1;min-width:180px;height:40px}
.eplist{display:flex;flex-direction:column;gap:4px}
.eprow{display:grid;grid-template-columns:clamp(120px,16vw,176px) 1fr auto;gap:14px;align-items:center;padding:10px;border-radius:14px;text-decoration:none}
.eprow:hover{background:var(--s2)}
.eprow.cur{background:rgba(55,255,139,.1);box-shadow:inset 3px 0 var(--volt)}
.eprow .thumb{border-radius:9px}
.eprow .num{position:absolute;left:6px;top:6px;background:rgba(11,5,22,.82);border-radius:6px;font-weight:800;font-size:12px;padding:1px 8px;z-index:1}
.eprow h4{font-size:14.5px;line-height:1.3}
.eprow .info{display:flex;flex-direction:column;gap:3px;min-width:0}
.eprow .info div{display:flex;gap:10px;color:var(--mut);font-size:12.5px}
.eprow .ok{color:var(--volt);font-weight:700}
.eprow.done .thumb{opacity:.55}
.eprow.cur .thumb{opacity:1}
.eprow .go{color:var(--volt);opacity:0;display:grid}
.eprow:hover .go{opacity:1}
.eprow .go svg{width:22px;height:22px}
.pbar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.2);z-index:1}
.pbar i{display:block;height:100%;background:var(--volt)}
.chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.char{display:flex;gap:12px;align-items:center;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:10px}
.char .av{width:54px;height:54px;border-radius:50%;overflow:hidden;background:var(--s3);flex:none;position:relative}
.char .av img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.char small{color:var(--mut);display:block;font-size:12.5px}
.rellist{display:flex;flex-direction:column;gap:6px}
.relrow{display:flex;gap:14px;align-items:center;padding:10px;border-radius:14px;text-decoration:none;background:var(--s1);border:1px solid var(--line)}
.relrow:hover{border-color:var(--volt)}
.relrow .mini{width:50px;aspect-ratio:2/3;border-radius:8px;overflow:hidden;position:relative;background:var(--s3);flex:none}
.relrow .mini img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.relrow small{color:var(--mut);display:block}

/* watch */
.wrap{--pad:84px;--top:84px;--side:clamp(340px,24vw,460px);--below:190px;display:grid;grid-template-columns:minmax(0,1fr) var(--side);gap:26px;padding:var(--pad) clamp(16px,4vw,48px) 20px;align-items:start;max-width:2200px;margin:0 auto}
body.hn .wrap{--pad:28px;--top:150px}
.player{position:relative;aspect-ratio:16/9;width:100%;max-height:max(280px,calc(100vh - var(--top) - var(--below)));max-height:max(280px,calc(100dvh - var(--top) - var(--below)));background:#000;border-radius:16px;overflow:hidden;box-shadow:0 30px 70px -20px rgba(0,0,0,.8)}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.pnote{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;gap:10px}
.pnote h3{font-family:var(--f-d);font-size:clamp(15px,2vw,20px);letter-spacing:-.02em}
.pnote p{color:#d9cdf5;max-width:52ch;font-size:14px}
.pnote code{background:rgba(255,255,255,.12);padding:2px 7px;border-radius:6px;font-size:13px}
.wbar{display:flex;gap:10px;margin:12px 0;flex-wrap:wrap}

function fbAiring(from, to, desc) {
  const out = [], tv = S.filter(x => x.format !== 'MOVIE');
  const d0 = new Date(from * 1000); d0.setHours(0, 0, 0, 0);
  for (let d = new Date(d0); d.getTime() / 1000 < to; d.setDate(d.getDate() + 1)) {
    tv.forEach((m, i) => {
      if (d.getDay() !== i % 7) return;
      const at = Math.floor(d.getTime() / 1000) + ((i * 5) % 24) * 3600 + ((i * 7) % 4) * 900;
      if (at > from && at < to) out.push({ ep: 2 + (i * 3) % 11, at, m });
    });
  }
  out.sort((a, b) => desc ? b.at - a.at : a.at - b.at);
  reg(out.map(x => x.m));
  return { items: out, more: false };
}
async function airing(from, to, page = 1, per = 50, desc = false) {
  const q = `{Page(page:${page},perPage:${per}){pageInfo{hasNextPage}airingSchedules(airingAt_greater:${from},airingAt_lesser:${to},sort:${desc ? 'TIME_DESC' : 'TIME'}){episode airingAt media{${MEDIA}}}}}`;
  try {
    const d = await gql(q);
    const items = d.Page.airingSchedules.filter(x => x.media && !x.media.isAdult && x.media.countryOfOrigin !== undefined).map(x => ({ ep: x.episode, at: x.airingAt, m: norm(x.media) }));
    reg(items.map(x => x.m));
    return { items, more: d.Page.pageInfo.hasNextPage };
  } catch (e) { fail(e); const r = fbAiring(from, to, desc); r.items = r.items.slice((page - 1) * per, page * per); return r; }
}
async function search(q) {
  try {
    const d = await gql(`query($q:String){Page(perPage:12){media(type:ANIME,isAdult:false,search:$q,sort:SEARCH_MATCH){${MEDIA}}}}`, { q });
    const items = d.Page.media.map(norm); reg(items); return items;

/* ============ Diálogos, avisos y utilidades de UI ============ */
function dialog(html, opts = {}) {
  const el = document.createElement('div');
  el.className = 'modal';
  el.innerHTML = `<div class="modal-card" role="dialog" aria-modal="true">${html}</div>`;
  const kd = e => { if (e.key === 'Escape') close(); };
  const close = () => { el.remove(); document.removeEventListener('keydown', kd); opts.onClose && opts.onClose(); };
  el.addEventListener('mousedown', e => { if (e.target === el) close(); });
  document.addEventListener('keydown', kd);
  document.body.appendChild(el);
  el.close = close;
  const f = $('[autofocus]', el) || $('input,textarea,button', el); f && f.focus();
  return el;
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2600);
}
function confirmBox(title, text, okLabel, fn) {
  const d = dialog(`<h2>${esc(title)}</h2><p>${text}</p><div class="modal-actions"><button class="btn" data-x>Cancelar</button><button class="btn volt" data-ok>${esc(okLabel)}</button></div>`);
  $('[data-x]', d).onclick = d.close;
  $('[data-ok]', d).onclick = () => { d.close(); fn(); };
}
function toggleAdd(id) {
  const m = REG.get(id) || LIB[id]?.m; if (!m) return;
  if (inList(id)) { setStatus(m, null); toast('Quitado de tu lista'); } else { setStatus(m, 'plan'); toast('Añadido a Pendientes'); }
  refreshAdds(id);
}
function refreshAdds(id) {
  $$(`[data-add="${id}"]`).forEach(b => {
    const on = inList(id);
    b.classList.toggle('on', on);
    b.setAttribute('aria-label', on ? 'Quitar de mi lista' : 'Añadir a mi lista');
    b.innerHTML = ic(on ? 'check' : 'plus');
  });
}

/* Cuadrícula con «Cargar más» */
function gridMount(host, fetcher, render = cardH, cls = 'grid') {
  host.innerHTML = `<div class="${cls}"></div><div class="more" hidden><button class="btn">Cargar más</button></div>`;
  const g = $('.' + cls.split(' ')[0], host), more = $('.more', host), btn = $('button', more);
  let page = 0, busy = false;
  const load = async () => {
    if (busy) return; busy = true; btn.disabled = true; btn.textContent = 'Cargando…';
    if (!page) g.innerHTML = '<div class="sk" style="aspect-ratio:2/3"></div>'.repeat(8);
    const r = await fetcher(++page);
    if (page === 1) g.innerHTML = '';
    g.insertAdjacentHTML('beforeend', r.items.map(render).join(''));
    if (page === 1 && !r.items.length) g.innerHTML = r.empty || emptyH('No hay resultados', 'Prueba con otro género, formato o periodo.', '<a class="btn volt" href="#/browse">Quitar filtros</a>');
    more.hidden = !r.more; btn.disabled = false; btn.textContent = 'Cargar más'; busy = false;
  };
  btn.onclick = load; load();
}

/* ---------- Calendario ---------- */
async function vSchedule(c) {
  const days = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'], t0 = new Date(); t0.setHours(0, 0, 0, 0);
  const mon = new Date(t0); mon.setDate(t0.getDate() - ((t0.getDay() + 6) % 7));
  const todayIx = (t0.getDay() + 6) % 7, di = c.q.has('d') ? Math.min(6, Math.max(0, +c.q.get('d') || 0)) : todayIx, mine = c.q.get('f') === 'mine';
  const tz = (Intl.DateTimeFormat().resolvedOptions().timeZone || '').replace(/_/g, ' ');
  const dayDate = i => { const d = new Date(mon); d.setDate(mon.getDate() + i); return d; };
  const qs = (d, f) => `#/schedule?d=${d}${f ? '&f=mine' : ''}`;
  c.set(`<div class="page"><span class="live"><i></i>En emisión</span><h1>Calendario</h1><p class="lead">Hora local: ${esc(tz || 'tu zona horaria')}.</p>
    <div class="pills" style="margin-top:20px">${days.map((d, i) => `<a class="pill${i === di ? ' on' : ''}" href="${qs(i, mine)}">${d} ${dayDate(i).getDate()}${i === todayIx ? ' (hoy)' : ''}</a>`).join('')}</div>
    <div class="pills" style="margin-top:12px"><a class="pill${mine ? '' : ' on'}" href="${qs(di, false)}">Todo</a><a class="pill${mine ? ' on' : ''}" href="${qs(di, true)}">Mi biblioteca</a></div></div><section class="sec" id="gh"><div class="eps-grid">${'<div class="sk" style="aspect-ratio:16/9"></div>'.repeat(6)}</div></section>`);
  const from = Math.floor(dayDate(di).getTime() / 1000), to = from + 86400;
  let items = [];
  for (let p = 1; p <= 3; p++) { const r = await airing(from, to, p, 50, false); items = items.concat(r.items); if (!r.more) break; if (!c.alive()) return; }
  if (!c.alive()) return;
  if (mine) items = items.filter(x => inList(x.m.id));
  items = uniq(items, x => x.m.id + '-' + x.ep).slice(0, 160);
  const nowS = now();
  $('#gh').innerHTML = items.length ? `<div class="eplist" style="max-width:860px">${items.map(x => `<a class="eprow" href="${watchHref(x.m.id, x.ep)}"><div class="thumb">${art(x.m, x.m.banner || x.m.cover)}<span class="num">${hhmm(x.at)}</span></div><div class="info"><h4>${esc(x.m.title)}</h4><div><span>Episodio ${x.ep}</span><span class="${x.at < nowS ? 'ok' : ''}">${x.at < nowS ? 'Ya emitido' : 'Sale ' + inT(x.at)}</span></div></div><span class="go">${ic('play')}</span></a>`).join('')}</div>` : emptyH(mine ? 'Nada de tu biblioteca este día' : 'Sin emisiones este día', mine ? 'Añade series con el botón + y aquí verás cuándo salen sus episodios.' : 'Prueba con otro día de la semana.');
}

/* ============ Vistas: serie, reproductor y espacio personal ============ */
const epCount = m => m.format === 'MOVIE' ? 1 : (m.aired ?? m.eps ?? 0);
const skTitle = '<div class="tbanner"><div class="tb-in"><div class="tposter sk"></div><div><div class="sk" style="height:40px;width:60%;margin-bottom:14px"></div><div class="sk" style="height:90px"></div></div></div></div>';

/* Lista de episodios (la usan la ficha y el reproductor) */
function mountEpisodes(host, m, { cur = 0 } = {}) {
  const n = epCount(m);
  if (!n) { host.innerHTML = emptyH('Aún no hay episodios', 'Cuando se emita el primero aparecerá aquí.'); return; }
  const map = {};
  (m.se || []).forEach(s => { const x = /Episode\s+(\d+)/i.exec(s.title || ''); if (x) map[+x[1]] = { t: (s.title || '').replace(/^Episode\s+\d+\s*[-:–]\s*/i, ''), th: s.thumbnail }; });
  const st = { sort: 'asc', q: '', r: cur ? Math.floor((cur - 1) / 100) : 0 };
  host.innerHTML = `<div class="eptools"><input class="field" type="search" placeholder="Buscar episodios" aria-label="Buscar episodios"><button class="pill" data-sort>Más antiguos</button><div class="pills"><button class="pill" data-lang="sub">Subtitulado</button><button class="pill" data-lang="dub">Doblaje</button></div></div><div class="ranges"></div><div class="eplist"></div>`;
  const list = $('.eplist', host), ranges = $('.ranges', host);
  const draw = () => {
    $$('[data-lang]', host).forEach(b => b.classList.toggle('on', b.dataset.lang === SET.lang));
    $('[data-sort]', host).textContent = st.sort === 'asc' ? 'Más antiguos' : 'Más recientes';
    const q = st.q.trim().toLowerCase(), pages = Math.ceil(n / 100);
    ranges.innerHTML = !q && pages > 1 ? Array.from({ length: pages }, (_, i) => `<button class="pill${i === st.r ? ' on' : ''}" data-r="${i}">${i * 100 + 1}–${Math.min(n, (i + 1) * 100)}</button>`).join('') : '';
    let eps = Array.from({ length: n }, (_, i) => i + 1);
    if (q) eps = /^\d+$/.test(q) ? eps.filter(e => String(e) === q) : eps.filter(e => ((map[e] && map[e].t) || '').toLowerCase().includes(q));
    else if (pages > 1) eps = eps.slice(st.r * 100, st.r * 100 + 100);
    if (st.sort === 'desc') eps.reverse();
    list.innerHTML = eps.length ? eps.map(e => {
      const info = map[e], done = (WATCHED[m.id] || []).includes(e);
      return `<a class="eprow${done ? ' done' : ''}${e === cur ? ' cur' : ''}" href="${watchHref(m.id, e, SET.lang)}"><div class="thumb">${art(m, (info && info.th) || m.banner || m.cover)}<span class="num">${e}</span></div><div class="info"><h4>Episodio ${e}${info && info.t ? ': ' + esc(info.t) : ''}</h4><div><span>${m.dur || 24} min</span>${done ? '<span class="ok">Visto</span>' : ''}</div></div><span class="go">${ic('play')}</span></a>`;
    }).join('') : '<p style="color:var(--mut)">Ningún episodio coincide con tu búsqueda.</p>';
  };
  host.addEventListener('input', e => { if (e.target.matches('input')) { st.q = e.target.value; draw(); } });
  host.addEventListener('click', e => {
    const r = e.target.closest('[data-r]'); if (r) { st.r = +r.dataset.r; draw(); return; }
    if (e.target.closest('[data-sort]')) { st.sort = st.sort === 'asc' ? 'desc' : 'asc'; draw(); return; }
    const l = e.target.closest('[data-lang]'); if (l) { SET.lang = l.dataset.lang; saveSet(); draw(); }
  });
  draw();
  if (cur) setTimeout(() => { const el = $('.eprow.cur', list); if (el && host.closest('.wside')) list.scrollTop = Math.max(0, el.offsetTop - list.offsetTop - 8); }, 50);
}

    <h2 class="stitle">Datos</h2><div class="srow"><div><b>Borrar datos de este dispositivo</b><p>Elimina tu biblioteca, historial, comentarios y ajustes. No se puede deshacer.</p></div><button class="btn sm" id="bWipe">Borrar</button></div></div>`);
  $$('[data-k]').forEach(i => i.onchange = () => { SET[i.dataset.k] = i.checked; saveSet(); });
  $$('.seg [data-lang]').forEach(b => b.onclick = () => { SET.lang = b.dataset.lang; saveSet(); $$('.seg [data-lang]').forEach(x => x.classList.toggle('on', x === b)); });
  $('#bTour').onclick = () => tour();
  $('#bWipe').onclick = () => confirmBox('¿Borrar todos tus datos?', 'Se eliminarán tu biblioteca, historial, comentarios, perfil y ajustes de este dispositivo. No se puede deshacer.', 'Borrar todo', () => { ['lib', 'hist', 'watched', 'set', 'prof', 'cmts', 'chat', 'rooms', 'notifs', 'tour'].forEach(k => { delete mem[k]; try { localStorage.removeItem('ak_' + k); } catch (e) {} }); LIB = {}; HIST = []; WATCHED = {}; PROF = null; NOTIFS = null; SET = { autonext: true, autoskip: false, lang: 'sub', subs: 'es', reduce: false }; saveSet(); drawHeader(); toast('Datos borrados'); render(true); });
}

/* ---------- Páginas informativas ---------- */
const PAGES = {
  about: ['Acerca de AniKura', '<p>AniKura es un catálogo de anime en español: descubre series y películas, sigue los estrenos de la semana, guarda tu biblioteca y comenta cada episodio.</p><h2>De dónde sale la información</h2><p>Los títulos, carátulas y fichas vienen de AniList. AniKura no aloja vídeos; el reproductor lo proporciona un servicio externo que tú configuras.</p>'],
  help: ['Ayuda', '<h2>¿Cómo guardo una serie?</h2><p>Pulsa el botón + sobre cualquier póster, o abre la ficha y elige un estado como Viendo o Pendiente.</p><h2>¿Cómo retomo un episodio?</h2><p>Entra en Biblioteca o en la fila «Seguir viendo» del inicio.</p><h2>¿Dónde se guardan mis datos?</h2><p>En este navegador. Usa Biblioteca, Exportar para llevarlos a otro dispositivo.</p><h2>Atajo de teclado</h2><p>Pulsa / en cualquier página para abrir el buscador.</p>'],
  contact: ['Contacto', '<p>Esta es una plantilla. Sustituye este texto por tu correo o tus redes antes de publicar el sitio.</p>'],
  terms: ['Condiciones de uso', '<p>Esta es una plantilla. Sustituye este texto por las condiciones reales de tu servicio antes de publicarlo.</p><p>AniKura muestra información de catálogo y no aloja contenido audiovisual.</p>'],
  privacy: ['Privacidad', '<p>AniKura guarda tu biblioteca, historial, comentarios y ajustes únicamente en el almacenamiento de tu navegador. No hay cuentas ni servidores propios en esta versión.</p><p>Al navegar, tu navegador consulta a AniList para obtener el catálogo. Revisa también la política de privacidad de tu proveedor de reproductor.</p>'],
  dmca: ['DMCA', '<p>Esta es una plantilla. Sustituye este texto por el procedimiento real para recibir avisos de retirada de contenido y el contacto de tu agente designado.</p><p>AniKura no aloja vídeos.</p>']
};
async function vStatic(c) { const p = PAGES[c.m[1]]; c.set(`<div class="page"><h1>${p[0]}</h1><div class="prose" style="margin-top:18px">${p[1]}</div></div>`); }

/* ---------- Presentación inicial ---------- */
function tour() {
  const steps = [['Bienvenido', 'El nuevo AniKura', 'Más rápido, más limpio y en español. Te enseñamos lo nuevo en medio minuto.'], ['Tu lista', 'Guarda lo que te interesa', 'Pulsa + en cualquier póster. Tu biblioteca recuerda en qué episodio ibas.'], ['Estrenos', 'Sigue la semana', 'El calendario te muestra a qué hora sale cada episodio en tu zona horaria. Pulsa / para buscar.']];
  let i = 0;
  const d = dialog('<div id="tb"></div>');
  const draw = () => { const s = steps[i]; $('#tb', d).innerHTML = `<p style="color:var(--volt);font-weight:700;margin:0">${s[0]}</p><h2>${s[1]}</h2><p>${s[2]}</p><div class="dots">${steps.map((_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('')}</div><div class="modal-actions" style="margin-top:6px"><button class="btn" data-x>Saltar</button><button class="btn volt" data-n>${i === steps.length - 1 ? 'Empezar' : 'Siguiente'}</button></div>`; $('[data-x]', d).onclick = d.close; $('[data-n]', d).onclick = () => { if (i === steps.length - 1) d.close(); else { i++; draw(); } }; $('[data-n]', d).focus(); };
  draw(); store.set('tour', 1);
}
/* ============ Enrutador y arranque ============ */
let curPath = '/', curRaw = '/', rt = 0, app;
const readHash = () => (location.hash || '#/').slice(1) || '/';
const ROUTES = [
  [/^\/?$/, vHome], [/^\/browse\/?$/, vBrowse], [/^\/latest\/?$/, vLatest], [/^\/genres\/?$/, vGenres], [/^\/schedule\/?$/, vSchedule], [/^\/movies\/?$/, vMovies], [/^\/doramas\/?$/, vDoramas],
  [/^\/library\/?$/, vLibrary], [/^\/community\/?$/, vCommunity], [/^\/together\/?$/, vTogether], [/^\/login\/?$/, vLogin], [/^\/settings\/?$/, vSettings], [/^\/profile\/?$/, vProfile],
  [/^\/title\/(\d+)\/?$/, vTitle], [/^\/watch\/(\d+)\/(\d+)\/(sub|dub)\/?$/, vWatch], [/^\/(about|help|contact|terms|privacy|dmca)\/?$/, vStatic]
];
function go(raw) { curRaw = raw; try { location.hash = '#' + raw; } catch (e) {} render(); }
async function render(keepScroll) {
  const [p, qs] = curRaw.split('?'), path = p.startsWith('/') ? p : '/' + p, q = new URLSearchParams(qs || '');
  curPath = path;
  const tok = ++rt;
  clearInterval(heroTimer);
  document.title = 'AniKura — anime y estrenos';
  setActive(path);
  $$('.panelpop').forEach(x => x.remove());
  let hit = null;
  for (const [re, fn] of ROUTES) { const m = re.exec(path); if (m) { hit = [fn, m]; break; } }
  const ctx = {
    q, m: hit ? hit[1] : [], alive: () => tok === rt,
    set(html, bind) { if (tok !== rt) return; app.innerHTML = html; bind && bind(app); bindRows(app); if (!keepScroll) window.scrollTo(0, 0); }
  };
  if (!hit) { ctx.set(`<div class="page">${emptyH('Esta página no existe', 'Revisa la dirección o vuelve al inicio.', '<a class="btn volt" href="#/">Ir al inicio</a>')}</div>`); return; }
  try { await hit[0](ctx); }
  catch (err) { console.error(err); if (tok === rt) ctx.set(`<div class="page">${emptyH('Algo salió mal', 'No pudimos cargar esta página. Inténtalo de nuevo.', '<button class="btn volt" id="bRetry">Reintentar</button>')}</div>`, () => { $('#bRetry').onclick = () => render(); }); }
  if (tok === rt && path === '/' && !q.has('notour') && !store.get('tour', 0)) setTimeout(() => { if (!store.get('tour', 0) && !$('.modal')) tour(); }, 900);
}

onOffline = () => {
  const n = $('#notice'); n.hidden = false; document.body.classList.add('hn');
  n.innerHTML = '<span>No pudimos conectar con el catálogo en línea, así que se muestra una selección de muestra.</span><button class="btn sm" id="nr">Reintentar</button>';
  $('#nr').onclick = () => { OFFLINE = false; n.hidden = true; document.body.classList.remove('hn'); render(true); };
};

window.addEventListener('hashchange', () => { const r = readHash(); if (r !== curRaw) { curRaw = r; render(); } });
window.addEventListener('scroll', () => $('#top').classList.toggle('solid', scrollY > 10), { passive: true });
document.addEventListener('click', e => { const l = e.target.closest('a[href^="#/"]'); if (!l || e.defaultPrevented || e.metaKey || e.ctrlKey || e.shiftKey || e.button) return; e.preventDefault(); const r = l.getAttribute('href').slice(1); if (r !== curRaw) go(r); else render(); });
document.addEventListener('click', e => { const a = e.target.closest('[data-add]'); if (a) { e.preventDefault(); toggleAdd(+a.dataset.add); } });
document.addEventListener('keydown', e => { if (e.key === '/' && !e.ctrlKey && !e.metaKey && !/INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || '')) { e.preventDefault(); openSearch(); } });

app = $('#app');
if (NOTIFS === null) { NOTIFS = [{ t: '<b>Te damos la bienvenida a AniKura.</b><br><span style="color:var(--mut)">Guarda series con + y retoma donde lo dejaste.</span>', read: false }]; store.set('notifs', NOTIFS); }
$('#skip').onclick = () => { app.setAttribute('tabindex', '-1'); app.focus(); };
saveSet(); drawHeader(); drawTabbar(); drawFooter();
curRaw = readHash();
render();
</script>
</body>
</html>
