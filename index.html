<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AniKura — anime y estrenos</title>
<meta name="description" content="Anime en español: catálogo, estrenos de la semana, calendario, biblioteca y perfiles.">
<meta name="theme-color" content="#0b0516">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Unbounded:wght@800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0516;--bg2:#07030f;--s1:#140a26;--s2:#1d1036;--s3:#2a1a4a;--line:rgba(167,139,250,.16);
  --violet:#7c4dff;--volt:#37ff8b;--volt-ink:#04210f;
  --tx:#f4efff;--mut:#ab9dcc;--faint:#7a6b9f;
  --r:4px;--r-panel:8px;--hh:56px;--pad:clamp(16px,4vw,56px);
  --f:'Lato',system-ui,-apple-system,'Segoe UI',sans-serif;--f-logo:'Unbounded',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{color-scheme:dark;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font:400 15px/1.5 var(--f);min-height:100vh}
a{color:inherit}
button{font-family:inherit}
img{max-width:100%}
:focus-visible{outline:2px solid var(--volt);outline-offset:2px;border-radius:4px}
.skip{position:fixed;left:12px;top:-60px;z-index:200;background:var(--volt);color:var(--volt-ink);padding:10px 16px;border-radius:var(--r);font-weight:900;border:0;cursor:pointer}
.skip:focus{top:12px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
#top{position:sticky;top:0;z-index:60;height:var(--hh);display:flex;align-items:center;gap:16px;padding:0 var(--pad);background:var(--bg2);border-bottom:1px solid rgba(255,255,255,.06)}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--f-logo);font-weight:800;font-size:17px;letter-spacing:-.03em;text-decoration:none;white-space:nowrap;margin-right:10px}
.logo b{color:var(--volt);font-weight:800}
.logo svg{width:26px;height:26px;flex:none}
.nav{display:flex;gap:2px;height:100%}
.nav>a,.ddb{display:flex;align-items:center;gap:5px;height:100%;padding:0 12px;color:var(--mut);text-decoration:none;font:700 14px var(--f);background:none;border:0;cursor:pointer;white-space:nowrap}
.nav>a:hover,.ddb:hover,.dd.open .ddb,.dd:hover .ddb{color:var(--tx)}
.nav>a.on{color:var(--volt)}
.ddb svg{width:15px;height:15px}
.dd{position:relative;height:100%;display:flex}
.ddm{display:none;position:absolute;top:100%;left:0;width:min(460px,90vw);background:var(--s1);border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r-panel) var(--r-panel);padding:12px;box-shadow:0 24px 50px rgba(0,0,0,.6);grid-template-columns:repeat(3,1fr);gap:2px 10px}
.dd:hover .ddm,.dd.open .ddm{display:grid}
.dd.shut .ddm{display:none!important}
.ddm a{padding:8px 10px;border-radius:var(--r);color:var(--mut);text-decoration:none;font-weight:700;font-size:14px}
.ddm a:hover{background:var(--s2);color:var(--tx)}
.ddm a.all{grid-column:1/-1;border-top:1px solid var(--line);margin-top:6px;border-radius:0;padding-top:12px;color:var(--volt)}
.spacer{flex:1}
.ibtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:none;border:0;color:var(--tx);cursor:pointer;position:relative;text-decoration:none;flex:none}
.ibtn:hover{background:rgba(255,255,255,.1)}
.ibtn svg{width:22px;height:22px}
.ibtn.on{color:var(--volt)}
#bMenu{display:none}
.pbtn{display:flex;align-items:center;gap:4px;background:none;border:0;color:var(--tx);cursor:pointer;padding:4px 8px 4px 4px;border-radius:999px;flex:none}
.pbtn:hover{background:rgba(255,255,255,.1)}
.pbtn>svg{width:15px;height:15px;color:var(--mut)}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#0b0516;flex:none;font-size:18px;position:relative;line-height:1;overflow:hidden}
.av.sm{width:32px;height:32px;font-size:17px}
.av.xl{font-size:clamp(44px,7vw,64px)}
.badge{position:absolute;top:2px;right:2px;background:var(--volt);color:var(--volt-ink);font-size:10px;font-weight:900;border-radius:999px;min-width:16px;height:16px;display:grid;place-items:center;padding:0 4px}
.notice{position:relative;z-index:55;background:linear-gradient(90deg,rgba(124,77,255,.35),rgba(55,255,139,.14));border-bottom:1px solid var(--line);padding:10px var(--pad);display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13.5px;color:#e5dbff}
.notice button{margin-left:auto}
.notice[hidden]{display:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 22px;border-radius:var(--r);border:0;font:900 13px var(--f);letter-spacing:.05em;text-transform:uppercase;cursor:pointer;text-decoration:none;color:var(--tx);background:rgba(255,255,255,.12);transition:background .15s,transform .15s,border-color .15s;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.22)}
.btn.volt{background:var(--volt);color:var(--volt-ink)}
.btn.volt:hover{background:#74ffae}
.btn.ghost{background:transparent;border:2px solid rgba(255,255,255,.35)}
.btn.ghost:hover{border-color:var(--tx);background:rgba(255,255,255,.08)}
.btn.sm{height:34px;padding:0 14px;font-size:12px}
.btn.round,.btn.sq{width:44px;padding:0}
.btn.sq{background:transparent;border:2px solid rgba(255,255,255,.35)}
.btn.sq:hover{border-color:var(--tx)}
.btn.sq.on,.btn.round.on{color:var(--volt);border-color:var(--volt)}
.btn.on{background:rgba(55,255,139,.16);color:var(--volt)}
.btn.danger{color:#ff8a9b}
.btn svg{width:18px;height:18px;flex:none}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* hero */
.hero{position:relative;height:clamp(440px,50vw,620px);display:flex;align-items:flex-end;padding:0 var(--pad) 84px;overflow:hidden;isolation:isolate;background:var(--bg)}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center 20%;z-index:-2;animation:hbg .8s ease both}
@keyframes hbg{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:scale(1)}}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(11,5,22,.97) 0%,rgba(11,5,22,.74) 32%,rgba(11,5,22,0) 70%),linear-gradient(0deg,var(--bg) 0%,rgba(11,5,22,0) 38%)}
.hero-body{max-width:580px;animation:rise .6s .1s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.hero h1{font:900 clamp(28px,4vw,54px)/1.05 var(--f);letter-spacing:-.01em;margin:12px 0 12px;text-wrap:balance;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hero h1 a{text-decoration:none}
.hero p.syn{color:#e6ddf7;max-width:56ch;font-size:15px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hero-actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;align-items:center}
.hero-art{position:absolute;right:clamp(70px,10vw,170px);bottom:70px;width:clamp(180px,20vw,280px);aspect-ratio:2/3;border-radius:var(--r);overflow:hidden;box-shadow:0 30px 70px -20px rgba(0,0,0,.85);animation:rise .8s .2s both}
.hero-dots{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);display:flex;gap:8px}
.hero-dots button{width:30px;height:4px;border-radius:2px;border:0;background:rgba(255,255,255,.28);cursor:pointer;position:relative;overflow:hidden;padding:0}
.hero-dots button.on::after{content:"";position:absolute;inset:0;background:var(--volt);transform-origin:left;animation:fill 8s linear forwards}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.harrow{position:absolute;top:0;bottom:0;width:48px;border:0;color:#fff;display:grid;place-items:center;cursor:pointer;opacity:0;transition:opacity .2s;z-index:3}
.harrow svg{width:28px;height:28px}
.harrow.l{left:0;background:linear-gradient(90deg,rgba(7,3,15,.7),transparent)}
.harrow.r{right:0;background:linear-gradient(270deg,rgba(7,3,15,.7),transparent)}
.hero:hover .harrow{opacity:1}
.harrow:hover{color:var(--volt)}
@media(hover:none){.harrow{display:none}}
.chips{display:flex;flex-wrap:wrap;gap:6px 0;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:#e6dcfb}
.chip+.chip::before{content:"";width:1px;height:12px;background:rgba(255,255,255,.32);margin:0 10px}
.chip.score{color:var(--volt)}
.chip svg{width:14px;height:14px}

/* sections and rows */
.sec{padding:0 var(--pad);margin-top:32px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:10px}
.sec-h h2{font:700 clamp(18px,2vw,22px) var(--f);letter-spacing:-.005em}
.sec-h a{color:var(--mut);font:900 12px var(--f);letter-spacing:.06em;text-transform:uppercase;text-decoration:none;white-space:nowrap}
.sec-h a:hover{color:var(--volt)}
.rowwrap{position:relative}
.scroller{scroll-padding-left:4px;display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;padding:8px 4px 18px;margin:0 -4px}
.scroller::-webkit-scrollbar{display:none}
.arrow{position:absolute;top:8px;bottom:70px;width:48px;border:0;color:#fff;display:none;place-items:center;cursor:pointer;z-index:4}
.arrow svg{width:28px;height:28px}
.arrow.l{left:-4px;background:linear-gradient(90deg,rgba(7,3,15,.95),rgba(7,3,15,0))}
.arrow.r{right:-4px;background:linear-gradient(270deg,rgba(7,3,15,.95),rgba(7,3,15,0))}
.rowwrap:hover .arrow{display:grid}
.arrow:hover{color:var(--volt)}
@media(hover:none){.arrow{display:none!important}}

/* poster cards */
.card{flex:0 0 auto;width:clamp(130px,13.2vw,184px);scroll-snap-align:start;position:relative}
.card .poster{display:block;position:relative;aspect-ratio:2/3;border-radius:var(--r);overflow:hidden;background:var(--s2)}
.art{position:absolute;inset:0;display:grid;place-items:center}
.art span{font-family:var(--f-logo);font-weight:800;font-size:clamp(26px,4vw,44px);letter-spacing:-.05em;color:rgba(255,255,255,.34)}
.card .poster img,.thumb img,.tposter img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.card .poster .pl{position:absolute;inset:0;display:grid;place-items:center;background:rgba(7,3,15,.5);opacity:0;transition:opacity .18s;z-index:1}
.card .poster .pl svg{width:46px;height:46px;padding:12px;border-radius:50%;background:var(--volt);color:var(--volt-ink)}
.card:hover .poster .pl,.card:focus-within .poster .pl{opacity:1}
.card:hover .poster,.card:focus-within .poster{box-shadow:0 0 0 2px var(--volt)}
.cmeta{display:flex;gap:6px;align-items:flex-start;margin-top:9px}
.cmeta .ct{flex:1;min-width:0;text-decoration:none;display:block}
.card h3{font-size:14px;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .ct:hover h3{color:var(--volt)}
.card .sub{color:var(--mut);font-size:12.5px;margin-top:3px;font-weight:400}
.add{flex:none;width:30px;height:30px;margin:-4px -6px 0 0;border-radius:50%;border:0;background:none;color:var(--mut);display:grid;place-items:center;cursor:pointer}
.add svg{width:20px;height:20px}
.add:hover{background:rgba(255,255,255,.1);color:var(--tx)}
.add.on{color:var(--volt)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:24px 16px}
.grid .card{width:auto}

/* episode cards */
.ep{flex:0 0 auto;width:clamp(240px,23vw,300px);scroll-snap-align:start;text-decoration:none;display:block}
.thumb{position:relative;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;background:var(--s2)}
.ep .tag{position:absolute;left:6px;top:6px;background:rgba(7,3,15,.86);padding:2px 8px;border-radius:3px;font-size:12px;font-weight:900;z-index:1}
.ep .tag.new{background:var(--volt);color:var(--volt-ink)}
.ep .dur{position:absolute;right:6px;bottom:6px;background:rgba(7,3,15,.86);padding:1px 7px;border-radius:3px;font-size:12px;font-weight:700;z-index:1}
.ep .play{position:absolute;inset:0;display:grid;place-items:center;background:rgba(7,3,15,.5);opacity:0;transition:.18s;z-index:1}
.ep .play svg{width:46px;height:46px;padding:12px;border-radius:50%;background:var(--volt);color:var(--volt-ink)}
.ep:hover .play,.ep:focus-visible .play{opacity:1}
.ep:hover .thumb{box-shadow:0 0 0 2px var(--volt)}
.ep h3{font-size:14px;font-weight:700;margin-top:9px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ep:hover h3{color:var(--volt)}
.ep .when{color:var(--mut);font-size:12.5px;margin-top:2px}
.eps-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:24px 16px}
.eps-grid .ep{width:auto}
.pbar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.22);z-index:1}
.pbar i{display:block;height:100%;background:var(--volt)}

/* page chrome */
.page{padding:36px var(--pad) 8px}
.page h1{font:900 clamp(24px,3.2vw,34px)/1.1 var(--f);letter-spacing:-.01em}
.page .lead{color:var(--mut);margin-top:8px;max-width:60ch}
.live{display:inline-flex;align-items:center;gap:8px;font:900 12px var(--f);letter-spacing:.08em;text-transform:uppercase;color:var(--volt);margin-bottom:10px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--volt);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(55,255,139,.6)}100%{box-shadow:0 0 0 10px rgba(55,255,139,0)}}
.filters{display:flex;flex-wrap:wrap;gap:14px;margin:22px 0 8px}
.sel{display:flex;flex-direction:column;gap:5px}
.sel label{font:900 11px var(--f);letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
select,.field{height:42px;border-radius:var(--r);background:var(--s2);border:1px solid var(--line);color:var(--tx);padding:0 14px;font:700 14px var(--f);min-width:176px}
select:hover,.field:hover{border-color:rgba(167,139,250,.4)}
.field:focus{outline:0;border-color:var(--volt)}
textarea.field{height:auto;padding:12px 14px;line-height:1.5;resize:vertical;width:100%}
input.field{width:100%}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{height:34px;padding:0 14px;border-radius:var(--r);border:0;background:var(--s2);color:var(--mut);font:700 13px var(--f);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pill:hover{color:var(--tx);background:var(--s3)}
.pill.on{background:var(--volt);color:var(--volt-ink)}
.more{display:flex;justify-content:center;margin:28px 0}
.empty{border:1px dashed rgba(167,139,250,.3);border-radius:var(--r-panel);padding:34px 24px;text-align:center;color:var(--mut);max-width:560px;margin:18px auto}
.empty h3{color:var(--tx);font-size:17px;margin-bottom:6px}
.empty .btn{margin-top:16px}
.sk{border-radius:var(--r);background:linear-gradient(100deg,var(--s2) 30%,var(--s3) 50%,var(--s2) 70%);background-size:300% 100%;animation:sh 1.4s infinite linear}
@keyframes sh{from{background-position:100% 0}to{background-position:-100% 0}}
.skrow{display:flex;gap:16px;overflow:hidden}
.skrow .sk{flex:0 0 clamp(130px,13.2vw,184px);aspect-ratio:2/3}
.skrow.wide .sk{flex-basis:clamp(240px,23vw,300px);aspect-ratio:16/9}
.hero>.hero-bg.sk{animation:sh 1.4s infinite linear}

/* genres */
.genres{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:24px}
.gtile{position:relative;height:104px;border-radius:var(--r);overflow:hidden;padding:16px 18px;text-decoration:none;display:flex;flex-direction:column;justify-content:flex-end;transition:box-shadow .2s}
.gtile:hover{box-shadow:0 0 0 2px var(--volt)}
.gtile b{font:900 18px var(--f);position:relative}
.gtile small{color:rgba(255,255,255,.7);font-size:12.5px;position:relative}
.gtile::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.1)}

/* title page */
.tbanner{position:relative;padding:48px var(--pad) 30px;overflow:hidden;isolation:isolate}
.tbanner .bg{position:absolute;inset:0;background-size:cover;background-position:center 20%;z-index:-2}
.tbanner::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,var(--bg) 4%,rgba(11,5,22,.66) 60%,rgba(11,5,22,.4)),linear-gradient(90deg,rgba(11,5,22,.88),rgba(11,5,22,.2))}
.tb-in{display:grid;grid-template-columns:220px 1fr;gap:32px;align-items:end;max-width:1200px}
.tposter{position:relative;aspect-ratio:2/3;border-radius:var(--r);overflow:hidden;box-shadow:0 24px 60px -16px rgba(0,0,0,.8);background:var(--s2)}
.tinfo h1{font:900 clamp(24px,3.2vw,40px)/1.06 var(--f);letter-spacing:-.01em;margin:12px 0;text-wrap:balance}
.tinfo .syn{color:#e6ddf7;max-width:70ch}
.tinfo .syn.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.linkbtn{background:none;border:0;color:var(--volt);font:900 12px var(--f);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;padding:6px 0}
.tact{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;position:relative}
.menu{position:absolute;top:52px;left:0;z-index:20;min-width:210px;background:var(--s2);border:1px solid var(--line);border-radius:var(--r-panel);padding:6px;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:var(--tx);padding:10px 12px;border-radius:var(--r);cursor:pointer;font:700 14px var(--f)}
.menu button:hover{background:rgba(255,255,255,.08)}
.menu button.on{color:var(--volt)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:22px;max-width:900px}
.stat{background:rgba(29,16,54,.72);border:1px solid var(--line);border-radius:var(--r-panel);padding:10px 14px}
.stat small{display:block;color:var(--mut);font-size:12px;font-weight:700}
.stat b{font-size:15px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{padding:14px 18px;color:var(--mut);font:900 12.5px var(--f);letter-spacing:.06em;text-transform:uppercase;background:none;border:0;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--tx)}
.tab.on{color:var(--tx);border-color:var(--volt)}
.tabpanel{padding-top:18px}
.eptools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.eptools .field{flex:1;min-width:180px;height:40px}
.eplist{display:flex;flex-direction:column;gap:4px}
.eprow{display:grid;grid-template-columns:clamp(120px,16vw,176px) 1fr auto;gap:14px;align-items:center;padding:8px;border-radius:var(--r-panel);text-decoration:none}
.eprow:hover{background:var(--s2)}
.eprow.cur{background:rgba(55,255,139,.1);box-shadow:inset 3px 0 var(--volt)}
.eprow .thumb{border-radius:var(--r)}
.eprow .num{position:absolute;left:6px;top:6px;background:rgba(7,3,15,.86);border-radius:3px;font-weight:900;font-size:12px;padding:1px 8px;z-index:1}
.eprow h4{font-size:14.5px;line-height:1.3}
.eprow .info{display:flex;flex-direction:column;gap:3px;min-width:0}
.eprow .info div{display:flex;gap:10px;color:var(--mut);font-size:12.5px}
.eprow .ok{color:var(--volt);font-weight:700}
.eprow.done .thumb{opacity:.55}
.eprow.cur .thumb{opacity:1}
.eprow .go{color:var(--volt);opacity:0;display:grid}
.eprow:hover .go{opacity:1}
.eprow .go svg{width:22px;height:22px}
.chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.char{display:flex;gap:12px;align-items:center;background:var(--s1);border:1px solid var(--line);border-radius:var(--r-panel);padding:10px}
.char .av{width:54px;height:54px;background:var(--s3)}
.char .av img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.char small{color:var(--mut);display:block;font-size:12.5px}
.rellist{display:flex;flex-direction:column;gap:6px}

function fbAiring(from, to, desc) {
  const out = [], tv = S.filter(x => x.format !== 'MOVIE');
  const d0 = new Date(from * 1000); d0.setHours(0, 0, 0, 0);
  for (let d = new Date(d0); d.getTime() / 1000 < to; d.setDate(d.getDate() + 1)) {
    tv.forEach((m, i) => {
      if (d.getDay() !== i % 7) return;
      const at = Math.floor(d.getTime() / 1000) + ((i * 5) % 24) * 3600 + ((i * 7) % 4) * 900;
      if (at > from && at < to) out.push({ ep: 2 + (i * 3) % 11, at, m });
    });
  }
  out.sort((a, b) => desc ? b.at - a.at : a.at - b.at);
  reg(out.map(x => x.m));
  return { items: out, more: false };
}
async function airing(from, to, page = 1, per = 50, desc = false) {
  const q = `{Page(page:${page},perPage:${per}){pageInfo{hasNextPage}airingSchedules(airingAt_greater:${from},airingAt_lesser:${to},sort:${desc ? 'TIME_DESC' : 'TIME'}){episode airingAt media{${MEDIA}}}}}`;
  try {
    const d = await gql(q);
    const items = d.Page.airingSchedules.filter(x => x.media && !x.media.isAdult && x.media.countryOfOrigin !== undefined).map(x => ({ ep: x.episode, at: x.airingAt, m: norm(x.media) }));
    reg(items.map(x => x.m));
    return { items, more: d.Page.pageInfo.hasNextPage };
  } catch (e) { fail(e); const r = fbAiring(from, to, desc); r.items = r.items.slice((page - 1) * per, page * per); return r; }
}
async function search(q) {
  try {

async function media(id) {

function dialog(html, opts = {}) {

  const kd = e => { if (e.key === 'Escape') close(); };
  const close = () => { el.remove(); document.removeEventListener('keydown', kd); opts.onClose && opts.onClose(); };

  document.addEventListener('keydown', kd);

/* Cuadrícula con «Cargar más» */
function gridMount(host, fetcher, render = cardH, cls = 'grid') {
  host.innerHTML = `<div class="${cls}"></div><div class="more" hidden><button class="btn">Cargar más</button></div>`;
  const g = $('.' + cls.split(' ')[0], host), more = $('.more', host), btn = $('button', more);
  let page = 0, busy = false;
  const load = async () => {
    if (busy) return; busy = true; btn.disabled = true; btn.textContent = 'Cargando…';
    if (!page) g.innerHTML = '<div class="sk" style="aspect-ratio:2/3"></div>'.repeat(8);
    const r = await fetcher(++page);
    if (page === 1) g.innerHTML = '';
    g.insertAdjacentHTML('beforeend', r.items.map(render).join(''));
    if (page === 1 && !r.items.length) g.innerHTML = r.empty || emptyH('No hay resultados', 'Prueba con otro género, formato o periodo.', '<a class="btn volt" href="#/browse">Quitar filtros</a>');

  };
  btn.onclick = load; load();
}

}

  c.set(`<div class="page" style="max-width:860px"><h1>Ajustes</h1><p class="lead">Hola, ${esc(me().name)}. Estos ajustes pertenecen a tu perfil y se guardan en este dispositivo.</p>
    <h2 class="stitle">Perfil</h2><div class="srow"><div><b>${esc(me().name)}</b><p>Cambia tu nombre, avatar y color, o crea y elige otros perfiles.</p></div><div class="tact" style="margin:0"><button class="btn sm" id="bEdit">Editar</button><button class="btn sm" id="bMgr">Administrar perfiles</button></div></div><div class="srow"><div><b>Presentación</b><p>Vuelve a ver lo nuevo de AniKura en medio minuto.</p></div><button class="btn sm" id="bTour">Ver</button></div>
    <h2 class="stitle">Reproducción</h2>${sw('autonext', 'Reproducir el siguiente episodio automáticamente', 'Pasa al siguiente episodio al terminar el actual.')}${sw('autoskip', 'Saltar aperturas y créditos', 'Omite automáticamente las aperturas y los créditos.')}${sw('resume', 'Retoma donde lo dejaste', '«Seguir viendo» te lleva al último episodio que abriste.', true)}
    <div class="srow"><div><b>Audio y subtítulos</b><p>Todos los episodios se reproducen con el audio original en japonés y subtítulos en español. Si un episodio no trae subtítulos en español, el reproductor muestra los de inglés.</p></div><span class="chip score">Automático</span></div>
    <h2 class="stitle">Apariencia</h2>${sw('reduce', 'Reducir animaciones', 'Desactiva los movimientos de la interfaz.')}
    <h2 class="stitle">Datos</h2><div class="srow"><div><b>Borrar los datos de este perfil</b><p>Elimina su biblioteca, historial y ajustes. No se puede deshacer.</p></div><button class="btn sm" id="bWipe">Borrar</button></div><div class="srow"><div><b>Borrar todo en este dispositivo</b><p>Elimina todos los perfiles y sus datos. No se puede deshacer.</p></div><button class="btn sm" id="bWipeAll">Borrar todo</button></div></div>`);
  $$('[data-k]').forEach(i => i.onchange = () => { SET[i.dataset.k] = i.checked; saveSet(); });
  $('#bEdit').onclick = () => openPicker({ form: PID, direct: true });
  $('#bMgr').onclick = () => openPicker({ manage: true });
  $('#bTour').onclick = () => tour();
  $('#bWipe').onclick = () => confirmBox('¿Borrar los datos de este perfil?', 'Se eliminarán la biblioteca, el historial y los ajustes de este perfil. No se puede deshacer.', 'Borrar', () => { PS.forEach(k => { delete mem[kk(k)]; try { localStorage.removeItem('ak_' + kk(k)); } catch (e) {} }); loadProfileData(); drawHeader(); toast('Datos del perfil borrados'); render(true); });
  $('#bWipeAll').onclick = () => confirmBox('¿Borrar todo?', 'Se eliminarán todos los perfiles y todos sus datos de este dispositivo. No se puede deshacer.', 'Borrar todo', () => { try { Object.keys(localStorage).filter(k => k.startsWith('ak_')).forEach(k => localStorage.removeItem(k)); sessionStorage.removeItem('ak_chosen'); } catch (e) {} Object.keys(mem).forEach(k => delete mem[k]); location.reload(); });
}

/* ---------- Páginas informativas ---------- */
const PAGES = {
  about: ['Acerca de AniKura', '<p>AniKura es un catálogo de anime en español: descubre series y películas, sigue los estrenos de la semana, guarda tu biblioteca en tu propio perfil y comenta cada episodio.</p><h2>De dónde sale la información</h2><p>Los títulos, carátulas y fichas vienen de AniList. AniKura no aloja vídeos; el reproductor lo proporciona un servicio externo que tú configuras.</p>'],
  help: ['Ayuda', '<h2>¿Cómo guardo una serie?</h2><p>Pulsa el botón + sobre cualquier póster, o abre la ficha y elige un estado como Viendo o Pendiente.</p><h2>¿Cómo retomo un episodio?</h2><p>Entra en Biblioteca o en la fila «Seguir viendo» del inicio.</p><h2>¿Cómo cambio de perfil?</h2><p>Pulsa tu avatar, arriba a la derecha, y elige otro perfil. Con Administrar perfiles puedes crear, editar o eliminar perfiles (hasta cinco).</p><h2>¿En qué idioma se ven los episodios?</h2><p>Siempre con audio en japonés y subtítulos en español. Si un episodio no trae subtítulos en español, el reproductor muestra los de inglés.</p><h2>¿Dónde se guardan mis datos?</h2><p>En este navegador. Usa Biblioteca, Exportar para llevarlos a otro dispositivo.</p><h2>Atajo de teclado</h2><p>Pulsa / en cualquier página para abrir el buscador.</p>'],
  contact: ['Contacto', '<p>Esta es una plantilla. Sustituye este texto por tu correo o tus redes antes de publicar el sitio.</p>'],
  terms: ['Condiciones de uso', '<p>Esta es una plantilla. Sustituye este texto por las condiciones reales de tu servicio antes de publicarlo.</p><p>AniKura muestra información de catálogo y no aloja contenido audiovisual.</p>'],
  privacy: ['Privacidad', '<p>AniKura guarda tus perfiles, bibliotecas, historiales, comentarios y ajustes únicamente en el almacenamiento de tu navegador. No hay cuentas ni servidores propios en esta versión.</p><p>Al navegar, tu navegador consulta a AniList para obtener el catálogo. Revisa también la política de privacidad de tu proveedor de reproductor.</p>'],
  dmca: ['DMCA', '<p>Esta es una plantilla. Sustituye este texto por el procedimiento real para recibir avisos de retirada de contenido y el contacto de tu agente designado.</p><p>AniKura no aloja vídeos.</p>']
};
async function vStatic(c) { const p = PAGES[c.m[1]]; c.set(`<div class="page"><h1>${p[0]}</h1><div class="prose" style="margin-top:18px">${p[1]}</div></div>`); }

/* ---------- Presentación inicial ---------- */
function tour() {
  const steps = [['Bienvenido', 'Tu perfil ya está listo', 'Cada perfil guarda su propia lista, historial y ajustes. Cambia de perfil desde tu avatar, arriba a la derecha.'], ['Audio y subtítulos', 'Japonés con subtítulos en español', 'Todos los episodios se reproducen con el audio original y subtítulos en español. Si no los hay, verás los de inglés.'], ['Tu lista', 'Guarda lo que te interesa', 'Pulsa + en cualquier póster. Tu biblioteca recuerda en qué episodio ibas.'], ['Estrenos', 'Sigue la semana', 'El calendario te muestra a qué hora sale cada episodio en tu zona horaria. Pulsa / para buscar.']];
  let i = 0;
  const d = dialog('<div id="tb"></div>');
  const draw = () => { const s = steps[i]; $('#tb', d).innerHTML = `<p style="color:var(--volt);font-weight:700;margin:0">${s[0]}</p><h2>${s[1]}</h2><p>${s[2]}</p><div class="dots">${steps.map((_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('')}</div><div class="modal-actions" style="margin-top:6px"><button class="btn" data-x>Saltar</button><button class="btn volt" data-n>${i === steps.length - 1 ? 'Empezar' : 'Siguiente'}</button></div>`; $('[data-x]', d).onclick = d.close; $('[data-n]', d).onclick = () => { if (i === steps.length - 1) d.close(); else { i++; draw(); } }; $('[data-n]', d).focus(); };
  draw(); store.set('tour', 1);
}
/* ============ Enrutador y arranque ============ */
let curPath = '/', curRaw = '/', rt = 0, app;
const readHash = () => (location.hash || '#/').slice(1) || '/';
const ROUTES = [
  [/^\/?$/, vHome], [/^\/browse\/?$/, vBrowse], [/^\/latest\/?$/, vLatest], [/^\/genres\/?$/, vGenres], [/^\/schedule\/?$/, vSchedule], [/^\/movies\/?$/, vMovies],
  [/^\/library\/?$/, vLibrary], [/^\/settings\/?$/, vSettings], [/^\/profile\/?$/, vProfile],
  [/^\/title\/(\d+)\/?$/, vTitle], [/^\/watch\/(\d+)\/(\d+)(?:\/(?:sub|dub))?\/?$/, vWatch], [/^\/(about|help|contact|terms|privacy|dmca)\/?$/, vStatic]
];
function go(raw) { curRaw = raw; try { location.hash = '#' + raw; } catch (e) {} render(); }
async function render(keepScroll) {
  if (!PID) return;   // sin perfil elegido todavía
  const [p, qs] = curRaw.split('?'), path = p.startsWith('/') ? p : '/' + p, q = new URLSearchParams(qs || '');
  curPath = path;
  const tok = ++rt;
  clearInterval(heroTimer);
  document.title = 'AniKura — anime y estrenos';
  setActive(path);
  $$('.panelpop').forEach(x => x.remove());
  let hit = null;
  for (const [re, fn] of ROUTES) { const m = re.exec(path); if (m) { hit = [fn, m]; break; } }
  const ctx = {
    q, m: hit ? hit[1] : [], alive: () => tok === rt,
    set(html, bind) { if (tok !== rt) return; app.innerHTML = html; bind && bind(app); bindRows(app); if (!keepScroll) window.scrollTo(0, 0); }
  };
  if (!hit) { ctx.set(`<div class="page">${emptyH('Esta página no existe', 'Revisa la dirección o vuelve al inicio.', '<a class="btn volt" href="#/">Ir al inicio</a>')}</div>`); return; }
  try { await hit[0](ctx); }
  catch (err) { console.error(err); if (tok === rt) ctx.set(`<div class="page">${emptyH('Algo salió mal', 'No pudimos cargar esta página. Inténtalo de nuevo.', '<button class="btn volt" id="bRetry">Reintentar</button>')}</div>`, () => { $('#bRetry').onclick = () => render(); }); }
  if (tok === rt && path === '/' && !q.has('notour') && !store.get('tour', 0)) setTimeout(() => { if (!store.get('tour', 0) && !$('.modal') && !$('.pick')) tour(); }, 900);
}

onOffline = () => {
  const n = $('#notice'); n.hidden = false; document.body.classList.add('hn');
  n.innerHTML = '<span>No pudimos conectar con el catálogo en línea, así que se muestra una selección de muestra.</span><button class="btn sm" id="nr">Reintentar</button>';
  $('#nr').onclick = () => { OFFLINE = false; n.hidden = true; document.body.classList.remove('hn'); render(true); };
};

window.addEventListener('hashchange', () => { const r = readHash(); if (r !== curRaw) { curRaw = r; render(); } });
document.addEventListener('click', e => { const l = e.target.closest('a[href^="#/"]'); if (!l || e.defaultPrevented || e.metaKey || e.ctrlKey || e.shiftKey || e.button) return; e.preventDefault(); const r = l.getAttribute('href').slice(1); if (r !== curRaw) go(r); else render(); });
document.addEventListener('click', e => { const a = e.target.closest('[data-add]'); if (a) { e.preventDefault(); toggleAdd(+a.dataset.add); } });
document.addEventListener('keydown', e => { if (e.key === '/' && !e.ctrlKey && !e.metaKey && !/INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || '')) { e.preventDefault(); openSearch(); } });

app = $('#app');
$('#skip').onclick = () => { app.setAttribute('tabindex', '-1'); app.focus(); };
document.addEventListener('click', e => { const d = $('.dd.open'); if (d && !d.contains(e.target)) d.classList.remove('open'); });
migrate();
PROFS = store.get('profs', []);
drawTabbar(); drawFooter();
curRaw = readHash();
{
  const act = store.get('active', null);
  const go1 = PROFS.length === 1 ? PROFS[0].id : (PROFS.length > 1 && sess.get() && profById(act) ? act : null);
  if (go1 && useProfile(go1)) { started = true; drawHeader(); render(); }
  else { drawHeader(); openPicker({ boot: true }); }
}
</script>
